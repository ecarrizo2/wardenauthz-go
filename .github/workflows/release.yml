name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./... -count=1
      - run: go vet ./...
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
